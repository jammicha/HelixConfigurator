# .github/workflows/native-release.yml
name: Native release
on:
  push:
    tags: ['v*']
  # Manual runs build + zip for smoke-testing; the release job below only
  # runs on a tag push (a release needs a tag to attach assets to).
  workflow_dispatch:

permissions:
  contents: write   # create releases + upload assets

jobs:
  build:
    strategy:
      # One platform's flake must not cancel the other zips mid-build —
      # the release job below needs all three.
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   platform: darwin-arm64, nodearch: arm64 }
          # Intel Macs (darwin-amd64) are intentionally NOT built: GitHub's only
          # Intel-Mac runner (macos-13) is EOL and no longer allocates, so the job
          # queued forever. Apple Silicon dominates; Intel users run the Docker image.
          - { os: ubuntu-latest,  platform: linux-amd64,  nodearch: x64   }
          - { os: windows-latest, platform: windows-amd64, nodearch: x64  }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      - name: Build frontend (typecheck + tests gate the build)
        # TZ via step env + vitest invoked directly: the npm script's POSIX
        # `TZ=… vitest run` prefix is unparseable by cmd.exe on the Windows
        # runner ('TZ' is not recognized…) — env: is cross-platform and set
        # before node starts, which Windows honors.
        env: { TZ: America/Chicago }
        run: cd frontend && npm ci && npx tsc --noEmit && npx vitest run && npm run build

      - name: Backend tests, then prune to prod deps (native addons)
        # Full install to run the test suite, then prune devDeps so the staged
        # package ships prod-only node_modules (as --omit=dev did before).
        run: cd backend && npm ci && npm test && npm prune --omit=dev

      - name: Verify native addon loaded
        # better-sqlite3 is the only native dep and the main cross-platform risk
        # (a missing prebuild silently falls back to a source build, or fails to
        # load). Fail loudly here rather than shipping a zip whose addon is broken.
        shell: bash
        run: cd backend && node -e "require('better-sqlite3'); console.log('better-sqlite3 OK on ${{ matrix.platform }}')"

      - name: Stage package
        shell: bash
        run: |
          set -e
          STAGE="helix-configurator"
          rm -rf "$STAGE" && mkdir -p "$STAGE/data"
          cp -R backend "$STAGE/backend"
          cp -R frontend/dist "$STAGE/frontend-dist"
          cp -R templates "$STAGE/templates"
          cp -R helix-otel "$STAGE/helix-otel"
          # Both chart skeletons must ship — the operator dir was once missing
          # here, so engine=operator chart downloads were hollow in native zips.
          cp -R helix-otel-operator "$STAGE/helix-otel-operator"
          cp helix-otel-collector.yaml "$STAGE/helix-otel-collector.yaml"
          # Empty .env so Step 1 Save works on first launch (POST /api/env reads
          # before write; missing file used to 500 on fresh native installs).
          touch "$STAGE/.env"
          # Tests don't belong in the shipped package.
          rm -rf "$STAGE/backend/__tests__"
          # Bundle the matching Node runtime
          node -e "const v=process.version;console.log(v)"
          NODE_DIR="$(dirname "$(command -v node)")"
          if [ "${{ runner.os }}" = "Windows" ]; then cp "$NODE_DIR/node.exe" "$STAGE/node.exe";
          else cp "$NODE_DIR/node" "$STAGE/node"; fi
          # Launchers
          cp packaging/start.sh "$STAGE/" 2>/dev/null || true
          cp packaging/start.command "$STAGE/" 2>/dev/null || true
          cp packaging/start.bat "$STAGE/" 2>/dev/null || true
          chmod +x "$STAGE/start.sh" "$STAGE/start.command" 2>/dev/null || true

      - name: Zip
        shell: bash
        run: |
          ZIP="helix-configurator-${{ matrix.platform }}.zip"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$ZIP" helix-configurator > /dev/null;
          else zip -ry "$ZIP" helix-configurator > /dev/null; fi

      # Hand the zip to the single release job below. Each matrix leg used to
      # call action-gh-release itself, and near-simultaneous legs raced on
      # creating the release ("already_exists" → retries exhausted → red run).
      - name: Stash zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: helix-configurator-${{ matrix.platform }}
          path: helix-configurator-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 3

  release:
    # One job creates the release exactly once, with every platform zip — no
    # create race. Tag pushes only; manual smoke runs stop at the artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect platform zips
        uses: actions/download-artifact@v4
        with:
          pattern: helix-configurator-*
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: helix-configurator-*.zip
          fail_on_unmatched_files: true
          prerelease: false   # latest/download/ must resolve to this release
