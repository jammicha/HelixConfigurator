name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Gate the image on the same checks the repo treats as its safety net
      # (backend unit tests, frontend typecheck + tests). Before this, a push
      # to main shipped straight to ghcr.io/…:latest with zero verification.
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      - name: Backend tests
        run: cd backend && npm ci && npm test

      - name: Frontend typecheck + tests
        run: cd frontend && npm ci && npx tsc --noEmit && npm test

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jammicha/helixconfigurator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}