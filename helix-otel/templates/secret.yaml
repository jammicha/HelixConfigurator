apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gateway.name }}-helix
  labels:
    {{- include "helix-otel.labels" . | nindent 4 }}
type: Opaque
stringData:
  HELIX_API_KEY: {{ required "helix.apiKey is required — pass --set helix.apiKey=<TenantID::AccessKey::SecretKey>" .Values.helix.apiKey | quote }}
