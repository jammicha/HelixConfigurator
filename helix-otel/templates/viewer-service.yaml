{{- if .Values.viewer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.viewer.name }}
  labels:
    {{- include "helix-otel.labels" . | nindent 4 }}
    {{- include "helix-otel.viewer.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.viewer.service.type }}
  selector:
    {{- include "helix-otel.viewer.selectorLabels" . | nindent 4 }}
  ports:
    # Exposed on 8765 (the configurator's host port) so the viewer answers at
    # http://localhost:8765/otel-data directly — LoadBalancer on Docker Desktop, no
    # port-forward. targetPort 3001 is the viewer container's actual port.
    - { name: http, port: 8765, targetPort: 3001, protocol: TCP }
{{- end }}
