receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
exporters:
  otlphttp/bmchelix:
    endpoint: ${env:HELIX_ENDPOINT}
    headers:
      X-Api-Key: ${env:HELIX_API_KEY}
      X-Source: ${env:X_SOURCE}
    sending_queue:
      enabled: true
  otlphttp/helix_local_viewer:
    traces_endpoint: http://helix-configurator:3001/api/otlp/traces
    logs_endpoint: http://helix-configurator:3001/api/otlp/logs
    encoding: json
    compression: none
    tls:
      insecure: true
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false
service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlphttp/bmchelix
        - otlphttp/helix_local_viewer
    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlphttp/bmchelix
    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlphttp/bmchelix
        - otlphttp/helix_local_viewer
