services:
  helix-configurator:
    build:
      context: .
      dockerfile: Dockerfile
    # Stable hostname so the gateway can fan trace data out to
    # http://helix-configurator:3001 over the helix-bridge network.
    container_name: helix-configurator
    ports:
      # 8765 matches the bundled install template — avoids colliding with
      # the Vite dev server on 3000.
      - "8765:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./helix-otel-collector.yaml:/app/helix-otel-collector.yaml
      - ./.env:/app/.env
      # Persist the local OTel trace store across container restarts.
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - TARGET_CONTAINER_NAME=helix-gateway
    depends_on:
      - helix-gateway
    networks:
      - helix-bridge

  helix-gateway:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: helix-gateway
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8888:8888'
    env_file:
      - .env
    volumes:
      - ./helix-otel-collector.yaml:/etc/otelcol-contrib/config.yaml
      # Step 0 Layer 1 pre-mounts — let hostmetrics + dockerstats receivers
      # scrape host telemetry without per-receiver container surgery.
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - helix-bridge

networks:
  helix-bridge:
    name: helix-bridge
    driver: bridge
