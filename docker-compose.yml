services:
  helix-configurator:
    build:
      context: .
      dockerfile: Dockerfile
    # Stable hostname so the gateway can fan trace data out to
    # http://helix-configurator:3001 over the helix-bridge network.
    container_name: helix-configurator
    # Give the backend time to checkpoint + close the SQLite store on SIGTERM
    # before Docker SIGKILLs it. The default 10s grace is too short for a large
    # store under load: a kill mid-checkpoint corrupts a spans B-tree page, and
    # the store then self-heals by quarantining it and starting fresh — losing
    # the accumulated window. 60s lets a clean shutdown finish first.
    stop_grace_period: 60s
    ports:
      # 8765 matches the bundled install template — avoids colliding with
      # the Vite dev server on 3000.
      - "8765:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./helix-otel-collector.yaml:/app/helix-otel-collector.yaml
      - ./.env:/app/.env
      # Persist the local OTel trace store across container restarts.
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - TARGET_CONTAINER_NAME=helix-gateway
    depends_on:
      - helix-gateway
    networks:
      - helix-bridge

  helix-gateway:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: helix-gateway
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8888:8888'
    env_file:
      - .env
    volumes:
      - ./helix-otel-collector.yaml:/etc/otelcol-contrib/config.yaml
    networks:
      - helix-bridge

networks:
  helix-bridge:
    name: helix-bridge
    driver: bridge
