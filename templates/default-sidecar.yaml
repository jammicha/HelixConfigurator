receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlphttp/bmchelix:
    endpoint: ${HELIX_ENDPOINT}
    headers:
      X-Api-Key: ${HELIX_API_KEY}
      X-Source: ${X_SOURCE}
    sending_queue:
      enabled: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/bmchelix]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/bmchelix]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/bmchelix]
