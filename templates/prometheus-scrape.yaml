receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Scrape an existing Prometheus endpoint exposed by your application.
  # Update the targets list to point at your app's :PORT/metrics.
  prometheus:
    config:
      scrape_configs:
        - job_name: 'app-metrics'
          scrape_interval: 30s
          static_configs:
            - targets: ['host.docker.internal:9090']

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Auth headers are sourced from .env at OTel collector startup via
  # ${env:VAR} substitution — secrets stay out of the committed YAML.
  otlphttp/bmchelix:
    endpoint: ${env:HELIX_ENDPOINT}
    headers:
      X-Api-Key: ${env:HELIX_API_KEY}
      X-Source: ${env:X_SOURCE}
    # Sending queue tuned for sustained burst throughput to Helix.
    # num_consumers = parallel HTTP workers shipping batches; queue_size is
    # bounded so the collector won't OOM under prolonged backpressure.
    sending_queue:
      enabled: true
      num_consumers: 100
      queue_size: 10000
  # Fan-out: traces and logs also flow to the configurator backend so the
  # local "View OTel Data" page can render waterfalls, errors, and DB insight.
  # Don't remove this — /otel-data depends on it.
  otlphttp/helix_local_viewer:
    traces_endpoint: http://helix-configurator:3001/api/otlp/traces
    logs_endpoint: http://helix-configurator:3001/api/otlp/logs
    encoding: json
    compression: none
    tls:
      insecure: true
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/bmchelix, otlphttp/helix_local_viewer]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [otlphttp/bmchelix]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/bmchelix, otlphttp/helix_local_viewer]
