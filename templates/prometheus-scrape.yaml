receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Scrape an existing Prometheus endpoint exposed by your application.
  # Update the targets list to point at your app's :PORT/metrics.
  prometheus:
    config:
      scrape_configs:
        - job_name: 'app-metrics'
          scrape_interval: 30s
          static_configs:
            - targets: ['host.docker.internal:9090']

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlphttp/bmchelix:
    endpoint: ${HELIX_ENDPOINT}
    headers:
      X-Api-Key: ${HELIX_API_KEY}
      X-Source: ${X_SOURCE}
    sending_queue:
      enabled: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/bmchelix]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [otlphttp/bmchelix]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/bmchelix]
