receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  # Tail sampling: keep all errors + slow traces, sample the rest.
  # Tune `decision_wait` and rate to your traffic volume.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 1000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 500
      - name: probabilistic
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  # Auth headers are sourced from .env at OTel collector startup via
  # ${env:VAR} substitution — secrets stay out of the committed YAML.
  otlphttp/bmchelix:
    endpoint: ${env:HELIX_ENDPOINT}
    headers:
      X-Api-Key: ${env:HELIX_API_KEY}
      X-Source: ${env:X_SOURCE}
    sending_queue:
      enabled: true
  # Fan-out: traces and logs also flow to the configurator backend so the
  # local "View OTel Data" page can render waterfalls, errors, and DB insight.
  # Don't remove this — /otel-data depends on it.
  otlphttp/helix_local_viewer:
    traces_endpoint: http://helix-configurator:3001/api/otlp/traces
    logs_endpoint: http://helix-configurator:3001/api/otlp/logs
    encoding: json
    compression: none
    tls:
      insecure: true
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [otlphttp/bmchelix, otlphttp/helix_local_viewer]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/bmchelix]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/bmchelix, otlphttp/helix_local_viewer]
