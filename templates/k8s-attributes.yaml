receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  # Enriches telemetry with Kubernetes pod / namespace / node metadata.
  # Requires the collector pod to have RBAC permissions to list pods/namespaces.
  k8sattributes:
    auth_type: serviceAccount
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.node.name
        - k8s.deployment.name
      labels:
        - tag_name: app
          key: app.kubernetes.io/name
          from: pod
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: connection

exporters:
  # Auth headers are sourced from .env at OTel collector startup via
  # ${env:VAR} substitution — secrets stay out of the committed YAML.
  otlphttp/bmchelix:
    endpoint: ${env:HELIX_ENDPOINT}
    headers:
      X-Api-Key: ${env:HELIX_API_KEY}
      X-Source: ${env:X_SOURCE}
    sending_queue:
      enabled: true
  # Fan-out: traces and logs also flow to the configurator backend so the
  # local "View OTel Data" page can render waterfalls, errors, and DB insight.
  # Don't remove this — /otel-data depends on it.
  otlphttp/helix_local_viewer:
    traces_endpoint: http://helix-configurator:3001/api/otlp/traces
    logs_endpoint: http://helix-configurator:3001/api/otlp/logs
    encoding: json
    compression: none
    tls:
      insecure: true
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [k8sattributes, batch]
      exporters: [otlphttp/bmchelix, otlphttp/helix_local_viewer]
    metrics:
      receivers: [otlp]
      processors: [k8sattributes, batch]
      exporters: [otlphttp/bmchelix]
    logs:
      receivers: [otlp]
      processors: [k8sattributes, batch]
      exporters: [otlphttp/bmchelix, otlphttp/helix_local_viewer]
