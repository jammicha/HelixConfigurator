<!doctype html>
<html><head><meta charset="utf-8"><title>Iconography</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../fonts/dpl-iconfont.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-surface);font-family:var(--font-family);}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;}
  .item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:4px;background:var(--gray-100);}
  .item i{font-size:22px;color:var(--fg1);}
  .item .n{font-size:9px;font-family:var(--font-family-mono);color:var(--fg3);text-align:center;line-height:1.2;}
  .meta{font-size:11px;color:var(--fg2);margin-bottom:10px;}
</style></head>
<body>
<div class="meta">DPL Icon Font 3 · 480+ glyphs · use class <code>d-icon d-icon-{name}</code></div>
<div class="grid">
  <div class="item"><i class="d-icon d-icon-search"></i><div class="n">search</div></div>
  <div class="item"><i class="d-icon d-icon-bell"></i><div class="n">bell</div></div>
  <div class="item"><i class="d-icon d-icon-gear"></i><div class="n">gear</div></div>
  <div class="item"><i class="d-icon d-icon-user_circle"></i><div class="n">user</div></div>
  <div class="item"><i class="d-icon d-icon-envelope"></i><div class="n">mail</div></div>
  <div class="item"><i class="d-icon d-icon-calendar"></i><div class="n">calendar</div></div>
  <div class="item"><i class="d-icon d-icon-chart_bar"></i><div class="n">chart_bar</div></div>
  <div class="item"><i class="d-icon d-icon-folder"></i><div class="n">folder</div></div>
  <div class="item"><i class="d-icon d-icon-check_circle"></i><div class="n">check</div></div>
  <div class="item"><i class="d-icon d-icon-cross_circle"></i><div class="n">cross</div></div>
  <div class="item"><i class="d-icon d-icon-exclamation_triangle"></i><div class="n">warn</div></div>
  <div class="item"><i class="d-icon d-icon-info_circle"></i><div class="n">info</div></div>
  <div class="item"><i class="d-icon d-icon-arrow_right"></i><div class="n">arrow_right</div></div>
  <div class="item"><i class="d-icon d-icon-download"></i><div class="n">download</div></div>
  <div class="item"><i class="d-icon d-icon-trash"></i><div class="n">trash</div></div>
  <div class="item"><i class="d-icon d-icon-pencil"></i><div class="n">pencil</div></div>
  <div class="item"><i class="d-icon d-icon-plus"></i><div class="n">plus</div></div>
  <div class="item"><i class="d-icon d-icon-filter"></i><div class="n">filter</div></div>
  <div class="item"><i class="d-icon d-icon-comment"></i><div class="n">comment</div></div>
  <div class="item"><i class="d-icon d-icon-star"></i><div class="n">star</div></div>
</div>
</body></html>
