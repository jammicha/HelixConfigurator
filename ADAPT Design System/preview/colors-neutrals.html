<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--bg-surface);}
  .ramp{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;}
  .step{display:flex;flex-direction:column;justify-content:flex-end;height:88px;border-radius:4px;padding:6px;border:1px solid rgba(0,0,0,.06);}
  .num{font-size:11px;font-weight:600;}
  .hex{font-family:var(--font-family-mono);font-size:9px;}
</style></head>
<body>
<div class="ramp">
  <div class="step" style="background:#ffffff;color:#22242a"><div class="num">white</div><div class="hex">#FFFFFF</div></div>
  <div class="step" style="background:#f9fafa;color:#22242a"><div class="num">100</div><div class="hex">#F9FAFA</div></div>
  <div class="step" style="background:#f1f1f4;color:#22242a"><div class="num">200</div><div class="hex">#F1F1F4</div></div>
  <div class="step" style="background:#d5d6dd;color:#22242a"><div class="num">300</div><div class="hex">#D5D6DD</div></div>
  <div class="step" style="background:#b3b6c1;color:#22242a"><div class="num">400</div><div class="hex">#B3B6C1</div></div>
  <div class="step" style="background:#8c8fa1;color:#fff"><div class="num">500</div><div class="hex">#8C8FA1</div></div>
  <div class="step" style="background:#707589;color:#fff"><div class="num">600</div><div class="hex">#707589</div></div>
  <div class="step" style="background:#555868;color:#fff"><div class="num">700</div><div class="hex">#555868</div></div>
  <div class="step" style="background:#393b46;color:#fff"><div class="num">800</div><div class="hex">#393B46</div></div>
  <div class="step" style="background:#22242a;color:#fff"><div class="num">900</div><div class="hex">#22242A</div></div>
  <div class="step" style="background:#1c1d22;color:#fff"><div class="num">1000</div><div class="hex">#1C1D22</div></div>
  <div class="step" style="background:#000;color:#fff"><div class="num">black</div><div class="hex">#000000</div></div>
</div>
</body></html>
