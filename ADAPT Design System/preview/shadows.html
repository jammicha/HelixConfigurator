<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:30px;background:var(--gray-100);}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  .card{background:#fff;border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:6px;}
  .lbl{font-size:12px;font-weight:600;color:var(--fg1);}
  .v{font-family:var(--font-family-mono);font-size:10px;color:var(--fg3);}
</style></head>
<body>
<div class="row">
  <div class="card shadow-1"><div class="lbl">shadow-1</div><div class="v">cards · subtle</div></div>
  <div class="card shadow-2"><div class="lbl">shadow-2</div><div class="v">menus · dropdowns</div></div>
  <div class="card shadow-3"><div class="lbl">shadow-3</div><div class="v">popovers</div></div>
  <div class="card shadow-4"><div class="lbl">shadow-4</div><div class="v">modals</div></div>
</div>
</body></html>
