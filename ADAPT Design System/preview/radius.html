<!doctype html>
<html><head><meta charset="utf-8"><title>Radius</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-surface);}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:88px;height:88px;background:var(--color-primary-muted);border:1.5px solid var(--color-primary);}
  .lbl{font-size:12px;font-weight:600;color:var(--fg1);}
  .v{font-family:var(--font-family-mono);font-size:11px;color:var(--fg2);}
</style></head>
<body>
<div class="row">
  <div class="item"><div class="box" style="border-radius:2px"></div><div class="lbl">sm</div><div class="v">2px</div></div>
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="lbl">md (default)</div><div class="v">4px</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="lbl">lg</div><div class="v">8px</div></div>
  <div class="item"><div class="box" style="border-radius:9999px"></div><div class="lbl">pill</div><div class="v">9999px</div></div>
</div>
</body></html>
