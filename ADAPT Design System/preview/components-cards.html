<!doctype html>
<html><head><meta charset="utf-8"><title>Card</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:var(--gray-100);font-family:var(--font-family);}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .card{background:#fff;border-radius:4px;border:1px solid var(--gray-200);overflow:hidden;}
  .card.elev{border:none;box-shadow:var(--shadow-1);}
  .hd{padding:10px 14px;border-bottom:1px solid var(--gray-200);font-weight:600;font-size:13px;color:var(--fg1);}
  .hd.tinted{background:#4040d9;color:#fff;border-bottom:none;}
  .body{padding:14px;font-size:13px;color:var(--fg1);}
  .meta{font-size:11px;color:var(--fg3);margin-top:6px;}
</style></head>
<body>
<div class="row">
  <div class="card"><div class="hd">Bordered</div><div class="body">Standard ADAPT card. 1px gray-300, 4px radius.<div class="meta">Default</div></div></div>
  <div class="card elev"><div class="hd">Elevated</div><div class="body">Shadow-1, no border. Used for clickable items.<div class="meta">.shadow-1</div></div></div>
  <div class="card elev"><div class="hd tinted">Primary inverse</div><div class="body">Tinted header, white body.<div class="meta">.card-primary .card-inverse</div></div></div>
</div>
</body></html>
