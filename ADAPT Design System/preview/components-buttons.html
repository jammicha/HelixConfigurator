<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px;background:var(--bg-surface);font-family:var(--font-family);}
  .row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
  .lbl{font-family:var(--font-family-mono);font-size:11px;color:var(--fg3);width:78px;}
  .btn{font-family:inherit;font-size:14px;font-weight:600;padding:6px 16px;border-radius:4px;border:1px solid transparent;cursor:pointer;line-height:1.4;}
  .btn-primary{background:#4040d9;color:#fff;}
  .btn-primary:hover{background:#3006c2;}
  .btn-secondary{background:#dde0ee;color:#22242a;border-color:#dde0ee;}
  .btn-tertiary{background:transparent;color:#3759d8;}
  .btn-link{background:none;color:#3759d8;text-decoration:underline;border:none;padding:6px 4px;}
  .btn-success{background:#11845b;color:#fff;}
  .btn-warning{background:#ffd200;color:#22242a;}
  .btn-danger{background:#b2001e;color:#fff;}
  .btn-helixgpt{background:#f86e00;color:#fff;}
  .btn-sm{padding:3px 12px;font-size:12px;}
  .btn-lg{padding:9px 22px;font-size:15px;}
</style></head>
<body>
  <div class="row"><div class="lbl">primary</div>
    <button class="btn btn-primary">Get started</button>
    <button class="btn btn-secondary">Cancel</button>
    <button class="btn btn-tertiary">Learn more</button>
    <button class="btn btn-link">View details</button>
  </div>
  <div class="row"><div class="lbl">semantic</div>
    <button class="btn btn-success">Approve</button>
    <button class="btn btn-warning">Review</button>
    <button class="btn btn-danger">Delete</button>
    <button class="btn btn-helixgpt">Ask HelixGPT</button>
  </div>
  <div class="row"><div class="lbl">sizes</div>
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-lg">Large</button>
  </div>
</body></html>
