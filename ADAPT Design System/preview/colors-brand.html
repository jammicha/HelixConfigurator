<!doctype html>
<html><head><meta charset="utf-8"><title>Brand Colors</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-surface);}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{height:64px;border-radius:6px;border:1px solid rgba(0,0,0,.06);}
  .name{font-size:12px;font-weight:600;color:var(--fg1);}
  .hex{font-family:var(--font-family-mono);font-size:11px;color:var(--fg2);}
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#4040d9"></div><div class="name">Primary</div><div class="hex">#4040D9</div></div>
  <div class="sw"><div class="chip" style="background:#3759d8"></div><div class="name">Active</div><div class="hex">#3759D8</div></div>
  <div class="sw"><div class="chip" style="background:#f86e00"></div><div class="name">HelixGPT</div><div class="hex">#F86E00</div></div>
  <div class="sw"><div class="chip" style="background:#ff5a4e"></div><div class="name">State</div><div class="hex">#FF5A4E</div></div>
  <div class="sw"><div class="chip" style="background:#dde0ee"></div><div class="name">Secondary</div><div class="hex">#DDE0EE</div></div>
</div>
</body></html>
